name: doclens
description: "Document scanner for Flutter with native edge detection and a 100% Flutter UI you fully control, plus a one-line escape hatch to the OS-native scanner."
version: 0.0.7
homepage: https://github.com/govindmaheshwari2/doclens
repository: https://github.com/govindmaheshwari2/doclens
issue_tracker: https://github.com/govindmaheshwari2/doclens/issues
topics:
  - scanner
  - document
  - camera
  - ml
  - ocr

environment:
  sdk: ^3.4.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.doclens.doclens
        pluginClass: DoclensPlugin
      ios:
        pluginClass: DoclensPlugin
